<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COSMIC EXPLORER | Ultra Realism Edition</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --neon-blue: #00f3ff;
      --neon-purple: #b967ff;
      --neon-pink: #ff2a6d;
      --neon-gold: #ffbe0b;
      --dark-bg: #010103;
      --glass-bg: rgba(3, 7, 18, 0.7);
      --glass-border: rgba(0, 243, 255, 0.25);
      --font-title: 'Orbitron', sans-serif;
      --font-body: 'Rajdhani', sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body { 
      background: var(--dark-bg); 
      color: #e0e6ed; 
      font-family: var(--font-body); 
      overflow: hidden; 
      height: 100vh;
      width: 100vw;
      user-select: none;
      -webkit-user-select: none;
    }

    #space { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; outline: none; }

    /* UI Panels */
    .glass-panel {
      background: var(--glass-bg);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid var(--glass-border);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8), inset 0 0 10px rgba(0,243,255,0.05);
    }

    /* Buttons */
    .glow-btn {
      background: rgba(0, 243, 255, 0.05); color: var(--neon-blue); border: 1px solid var(--neon-blue);
      padding: 8px 18px; border-radius: 30px; cursor: pointer; font-family: var(--font-title);
      transition: all 0.3s ease; font-size: 0.85rem; letter-spacing: 1px; font-weight: 600;
    }
    .glow-btn:hover, .glow-btn.active { background: var(--neon-blue); color: #000; box-shadow: 0 0 20px var(--neon-blue); transform: translateY(-2px); }
    .btn-gold { color: var(--neon-gold); border-color: var(--neon-gold); background: rgba(255, 190, 11, 0.05); }
    .btn-gold:hover, .btn-gold.active { background: var(--neon-gold); color: #000; box-shadow: 0 0 20px var(--neon-gold); }
    .full-width { width: 100%; margin-top: 20px; display: block; }

    /* Top HUD */
    .hud-top {
      position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 10;
      display: flex; align-items: center; justify-content: center; gap: 20px;
      padding: 12px 35px; border-radius: 50px; border-top: 1px solid rgba(255,255,255,0.2);
    }
    .hud-top h1 { font-family: var(--font-title); font-size: 1.3rem; letter-spacing: 4px; color: #fff; text-shadow: 0 0 15px var(--neon-blue); }

    /* Scale Info */
    #scale-info {
      position: fixed; bottom: 30px; left: 30px; z-index: 10;
      font-family: var(--font-title); padding: 20px; border-radius: 12px;
      border-left: 4px solid var(--neon-blue); pointer-events: none; min-width: 250px; transition: border-color 0.5s;
    }
    #view-layer { font-size: 1.1rem; color: #fff; letter-spacing: 1px; font-weight: 700; }
    #dist-value { font-size: 0.9rem; color: var(--neon-blue); margin-top: 5px; font-family: var(--font-body); font-weight: 600;}
    .instruction { font-size: 0.75rem; color: #888; margin-top: 10px; text-transform: uppercase; letter-spacing: 1px; }

    /* Time Control UI */
    #time-control {
      position: fixed; bottom: 30px; right: 30px; z-index: 10;
      padding: 15px 20px; border-radius: 12px; border-right: 4px solid var(--neon-pink);
      display: flex; flex-direction: column; gap: 10px;
    }
    #time-control label { font-family: var(--font-title); font-size: 0.8rem; color: #fff; letter-spacing: 1px; display: flex; justify-content: space-between; }
    #time-slider { width: 160px; cursor: pointer; accent-color: var(--neon-pink); }

    /* Sidebar Navigation */
    #sidebar {
      position: fixed; right: 30px; top: 50%; transform: translateY(-50%); z-index: 10;
      padding: 15px; border-radius: 12px; display: flex; flex-direction: column; gap: 8px;
      max-height: 75vh; overflow-y: auto;
    }
    #sidebar::-webkit-scrollbar { width: 4px; }
    #sidebar::-webkit-scrollbar-thumb { background: var(--neon-blue); border-radius: 10px; }
    .sidebar-title { font-family: var(--font-title); font-size: 0.8rem; color: var(--neon-purple); margin-bottom: 10px; text-align: center; letter-spacing: 2px; }
    .nav-btn {
      background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.08); color: #ccc;
      padding: 8px 15px; border-radius: 6px; font-family: var(--font-body); font-size: 0.9rem; cursor: pointer;
      text-align: left; transition: all 0.3s ease; text-transform: uppercase; letter-spacing: 1px; font-weight: 600;
    }
    .nav-btn:hover, .nav-btn.active {
      background: rgba(0, 243, 255, 0.15); color: #fff; border-color: var(--neon-blue);
      text-shadow: 0 0 5px var(--neon-blue); transform: translateX(-5px); box-shadow: -5px 0 15px rgba(0,243,255,0.2);
    }
    .nav-divider { width: 100%; height: 1px; background: rgba(255,255,255,0.1); margin: 5px 0; }
    #reset-btn { margin-top: 10px; border-color: var(--neon-pink); color: var(--neon-pink); text-align: center; }

    /* Cosmic Labels */
    .cosmic-label {
      position: absolute; color: rgba(255,255,255,0.9); font-family: var(--font-body); font-weight: 600;
      font-size: 0.85rem; pointer-events: none; text-shadow: 0 0 6px #000, 0 0 2px #000;
      white-space: nowrap; transition: opacity 0.3s; opacity: 0; text-transform: uppercase; letter-spacing: 2px; transform: translate(-50%, -50%);
    }
    .cosmic-label::before {
      content: ''; display: block; width: 5px; height: 5px; background: var(--neon-blue);
      border-radius: 50%; margin: 0 auto 5px auto; box-shadow: 0 0 8px var(--neon-blue);
    }
    .cosmic-label.visible { opacity: 1; }
    .cosmic-label.galaxy-label { color: var(--neon-purple); font-family: var(--font-title); font-size: 0.7rem; }
    .cosmic-label.galaxy-label::before { background: var(--neon-purple); box-shadow: 0 0 8px var(--neon-purple); }

    /* Information Panel */
    .info-panel {
      position: fixed; left: 30px; top: 50%; transform: translateY(-50%) scale(0.9);
      width: min(90vw, 400px); max-height: 85vh; overflow-y: auto;
      padding: 25px; border-radius: 16px; z-index: 20;
      opacity: 0; pointer-events: none; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .info-panel.active { opacity: 1; pointer-events: all; transform: translateY(-50%) scale(1); }
    .info-panel::-webkit-scrollbar { width: 4px; }
    .info-panel::-webkit-scrollbar-thumb { background: var(--neon-purple); border-radius: 10px; }

    .close-btn { position: absolute; top: 15px; right: 15px; background: none; border: none; color: var(--neon-purple); font-size: 1.2rem; cursor: pointer; transition: 0.3s; }
    .close-btn:hover { color: var(--neon-pink); transform: rotate(90deg); }

    .panel-header { display: flex; align-items: center; gap: 15px; margin-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px; }
    .planet-visual-container { width: 80px; height: 80px; position: relative; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
    .css-planet { width: 100%; height: 100%; border-radius: 50%; box-shadow: inset -15px -15px 25px rgba(0,0,0,0.8), 0 0 10px rgba(255,255,255,0.2); }
    .css-rings { position: absolute; width: 160%; height: 25%; border-radius: 50%; border: 6px solid rgba(240, 226, 197, 0.6); transform: rotate(20deg); pointer-events: none; }
    .panel-content-wrap { flex-grow: 1; }
    .panel-header h2 { font-family: var(--font-title); font-size: 1.5rem; color: #fff; letter-spacing: 2px; margin-bottom: 5px; }
    .panel-header span { font-family: var(--font-body); color: var(--neon-blue); font-size: 0.9rem; letter-spacing: 1px; }

    #p-desc { line-height: 1.5; color: #ddd; font-size: 0.95rem; margin-bottom: 20px; font-weight: 500; }
    
    /* Stats */
    .section-title { font-family: var(--font-title); font-size: 0.85rem; color: var(--neon-purple); margin: 20px 0 10px; letter-spacing: 1px; text-align: center; }
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .stat-box { background: rgba(0,0,0,0.4); padding: 10px; border-radius: 8px; border-left: 2px solid var(--neon-purple); }
    .stat-label { font-size: 0.7rem; color: #999; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 3px; }
    .stat-value { font-size: 1rem; color: #fff; font-family: var(--font-title); }

    .data-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; }
    .data-card { background: rgba(255,255,255,0.05); padding: 10px; border-radius: 8px; text-align: center; border: 1px solid rgba(255,255,255,0.1); }
    .data-card h4 { font-size: 0.7rem; color: #aaa; margin-bottom: 5px; text-transform: uppercase; }
    .data-card span { font-size: 0.95rem; font-weight: 600; color: #fff; }

    /* Atmosphere Chart */
    .chart-container { display: flex; align-items: flex-end; justify-content: space-around; height: 120px; margin-top: 10px; padding: 10px 10px 25px; background: rgba(0,0,0,0.4); border-radius: 10px; }
    .chart-bar { width: 15%; background: linear-gradient(to top, var(--neon-blue), var(--neon-purple)); border-radius: 4px 4px 0 0; position: relative; transition: height 0.6s ease; box-shadow: 0 0 10px rgba(0,243,255,0.3); }
    .chart-bar::after { content: attr(data-label); position: absolute; bottom: -22px; left: 50%; transform: translateX(-50%); font-size: 0.65rem; white-space: nowrap; color: #ccc; }

    /* Quiz Panel */
    #quiz-panel {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.9);
      width: min(90vw, 500px); padding: 30px; border-radius: 16px; z-index: 30;
      opacity: 0; pointer-events: none; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    #quiz-panel.active { opacity: 1; pointer-events: all; transform: translate(-50%, -50%) scale(1); }
    #quiz-panel h2 { font-family: var(--font-title); color: var(--neon-blue); text-align: center; letter-spacing: 2px; margin-bottom: 20px; }
    #quiz-question { text-align: center; font-size: 1.1rem; margin-bottom: 20px; line-height: 1.4; font-weight: 600;}
    
    .quiz-options { display: grid; gap: 12px; }
    .quiz-option {
      background: rgba(0,0,0,0.5); padding: 12px 15px; border-radius: 8px; cursor: pointer;
      border: 1px solid rgba(255,255,255,0.1); transition: 0.3s; text-align: left; color: #fff; font-family: var(--font-body); font-size: 1rem;
    }
    .quiz-option:hover { background: rgba(0,243,255,0.2); border-color: var(--neon-blue); }
    .quiz-option.correct { background: rgba(0,255,100,0.3); border-color: #00ff66; box-shadow: 0 0 10px rgba(0,255,100,0.4);}
    .quiz-option.wrong { background: rgba(255,50,50,0.3); border-color: #ff3333; box-shadow: 0 0 10px rgba(255,50,50,0.4);}
    .quiz-option.disabled { pointer-events: none; opacity: 0.6; }
    
    .quiz-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; }
    .score-display { font-family: var(--font-title); color: var(--neon-pink); font-size: 1.1rem; }
    .hidden { display: none !important; }

    /* Loader */
    #loader {
      position: fixed; inset: 0; background: #010103; z-index: 1000;
      display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.8s ease;
    }
    .orbits-spinner { position: relative; width: 100px; height: 100px; }
    .orbit { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); border-radius: 50%; border: 2px solid transparent; }
    .orbit:nth-child(1) { width: 40px; height: 40px; border-top-color: var(--neon-blue); animation: spin 1s linear infinite; }
    .orbit:nth-child(2) { width: 70px; height: 70px; border-right-color: var(--neon-purple); animation: spin 2s linear infinite reverse; }
    .orbit:nth-child(3) { width: 100px; height: 100px; border-bottom-color: var(--neon-gold); animation: spin 3s linear infinite; }
    @keyframes spin { to { transform: translate(-50%, -50%) rotate(360deg); } }

    @media (max-width: 768px) {
      .hud-top { gap: 10px; padding: 10px 15px; width: 95%; flex-wrap: wrap;}
      .hud-top h1 { font-size: 1rem; }
      #sidebar { display: none; }
      #scale-info { top: 120px; bottom: auto; left: 50%; transform: translateX(-50%); width: 90%; text-align: center; }
      #time-control { right: 50%; bottom: 20px; transform: translateX(50%); border-right: none; border-bottom: 4px solid var(--neon-pink); flex-direction: row; align-items: center; width: 90%;}
      .info-panel { width: 95vw; left: 50%; transform: translate(-50%, -50%) scale(0.9); padding: 15px; }
      .info-panel.active { transform: translate(-50%, -50%) scale(1); }
    }
  </style>
</head>
<body>

  <div id="loader">
    <div class="orbits-spinner"><div class="orbit"></div><div class="orbit"></div><div class="orbit"></div></div>
    <p style="margin-top:25px; font-family: var(--font-title); color: #fff; letter-spacing: 3px; font-size: 0.9rem;">GENERATING UNIVERSE...</p>
  </div>

  <canvas id="space"></canvas>

  <div class="hud-top glass-panel">
    <h1>COSMIC EXPLORER</h1>
    <button id="cinematic-btn" class="glow-btn btn-gold">🎬 AUTO-PAN</button>
    <button id="global-quiz-btn" class="glow-btn">🧠 START QUIZ</button>
  </div>

  <div id="scale-info" class="glass-panel">
    <div id="view-layer">SOLAR SYSTEM</div>
    <div id="dist-value">0 KM</div>
    <div class="instruction">DRAG TO ROTATE • SCROLL TO ZOOM</div>
  </div>

  <div id="time-control" class="glass-panel">
    <label>ORBITAL SPEED <span id="time-val" style="color:var(--neon-pink);">1.0x</span></label>
    <input type="range" id="time-slider" min="0" max="200" value="10">
  </div>

  <div id="sidebar" class="glass-panel">
    <div class="sidebar-title">SYSTEM NAVIGATOR</div>
    <div id="nav-buttons-container" style="display:flex; flex-direction:column; gap:5px;"></div>
    <button id="reset-btn" class="nav-btn">RESET VIEW</button>
  </div>

  <div id="label-container"></div>

  <!-- Information Panel -->
  <div id="info-panel" class="glass-panel info-panel">
    <button class="close-btn" id="close-panel-btn">✕</button>
    <div class="panel-header">
      <div class="planet-visual-container" id="p-visual-container"></div>
      <div class="panel-content-wrap">
        <h2 id="p-name">EARTH</h2>
        <span id="p-type">Terrestrial Planet</span>
      </div>
    </div>
    <p id="p-desc">Description</p>
    
    <div class="stats-grid">
      <div class="stat-box"><div class="stat-label" id="lbl-dist">Distance</div><div class="stat-value" id="p-dist">-</div></div>
      <div class="stat-box"><div class="stat-label" id="lbl-size">Radius</div><div class="stat-value" id="p-size">-</div></div>
      <div class="stat-box"><div class="stat-label" id="lbl-period">Orbital Period</div><div class="stat-value" id="p-period">-</div></div>
      <div class="stat-box"><div class="stat-label" id="lbl-moons">Moons</div><div class="stat-value" id="p-moons">-</div></div>
    </div>

    <h3 class="section-title">DETAILED FACTS</h3>
    <div class="data-grid" id="p-facts-grid"></div>

    <div id="atmosphere-section">
      <h3 class="section-title">ATMOSPHERE</h3>
      <div class="chart-container" id="p-chart-container"></div>
    </div>

    <button id="planet-quiz-btn" class="glow-btn full-width">TAKE QUIZ ON THIS TARGET</button>
  </div>

  <!-- Quiz Panel -->
  <div id="quiz-panel" class="glass-panel">
    <button class="close-btn" id="close-quiz-btn">✕</button>
    <h2>🚀 SOLAR SYSTEM QUIZ</h2>
    <div id="quiz-question">Question goes here</div>
    <div class="quiz-options" id="quiz-options"></div>
    <div class="quiz-footer">
      <div class="score-display">SCORE: <span id="quiz-score">0</span>/<span id="quiz-total">0</span></div>
      <button id="quiz-next-btn" class="glow-btn hidden">NEXT ➔</button>
      <button id="quiz-restart-btn" class="glow-btn hidden">RESTART 🔄</button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <script>
    // ==========================================
    // PROCEDURAL TEXTURE GENERATORS (Canvas API)
    // ==========================================
    // Pseudo-random noise function for canvas textures
    function pseudoNoise(x, y) {
      return (Math.sin(x * 12.9898 + y * 78.233) * 43758.5453) % 1;
    }

    // Creates banded texture for Gas Giants (Jupiter/Saturn)
    function createGasGiantTexture(color1, color2, color3, bands=10) {
      const canvas = document.createElement('canvas');
      canvas.width = 512; canvas.height = 256;
      const ctx = canvas.getContext('2d');
      for (let y = 0; y < canvas.height; y++) {
        const noise = Math.sin(y * bands / canvas.height * Math.PI * 2) + pseudoNoise(0, y) * 0.5;
        let c;
        if (noise > 0.5) c = color1;
        else if (noise > -0.2) c = color2;
        else c = color3;
        ctx.fillStyle = c;
        ctx.fillRect(0, y, canvas.width, 1);
      }
      return new THREE.CanvasTexture(canvas);
    }

    // Creates mottled rocky texture for Terrestrials (Mars, Mercury)
    function createRockyTexture(baseColor, accentColor) {
      const canvas = document.createElement('canvas');
      canvas.width = 512; canvas.height = 256;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = baseColor; ctx.fillRect(0, 0, 512, 256);
      for(let i=0; i<3000; i++) {
        const x = Math.random() * 512; const y = Math.random() * 256;
        const r = Math.random() * 4;
        ctx.fillStyle = Math.random() > 0.5 ? accentColor : 'rgba(0,0,0,0.2)';
        ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill();
      }
      return new THREE.CanvasTexture(canvas);
    }

    // Earth Earth-like texture (Water + Continents)
    function createEarthTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 1024; canvas.height = 512;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#0a2e5c'; // Deep ocean
      ctx.fillRect(0, 0, 1024, 512);
      ctx.fillStyle = '#2d6a4f'; // Land
      for(let i=0; i<200; i++) {
        const x = Math.random() * 1024; const y = Math.random() * 512;
        const r = 10 + Math.random() * 40;
        ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill();
      }
      return new THREE.CanvasTexture(canvas);
    }

    // Earth Clouds texture
    function createCloudTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 1024; canvas.height = 512;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0,0,1024,512);
      ctx.fillStyle = 'rgba(255,255,255,0.6)';
      for(let i=0; i<400; i++) {
        const x = Math.random() * 1024; const y = Math.random() * 512;
        const r = 5 + Math.random() * 25;
        ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill();
      }
      return new THREE.CanvasTexture(canvas);
    }

    // The Sun Surface Texture
    function createSunTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 512; canvas.height = 256;
      const ctx = canvas.getContext('2d');
      for (let y = 0; y < 256; y++) {
        for (let x = 0; x < 512; x++) {
          const n = pseudoNoise(x*0.1, y*0.1);
          ctx.fillStyle = n > 0.5 ? '#ffcc00' : (n > 0.2 ? '#ff6600' : '#cc0000');
          ctx.fillRect(x, y, 1, 1);
        }
      }
      return new THREE.CanvasTexture(canvas);
    }

    // Realistic Saturn Ring Texture (1D Gradient mapped to a RingGeometry)
    function createRingTexture(colorHex) {
      const canvas = document.createElement('canvas');
      canvas.width = 256; canvas.height = 1;
      const ctx = canvas.getContext('2d');
      const grd = ctx.createLinearGradient(0, 0, 256, 0);
      grd.addColorStop(0, 'rgba(0,0,0,0)');
      grd.addColorStop(0.1, colorHex);
      grd.addColorStop(0.3, 'rgba(0,0,0,0.1)'); // gap
      grd.addColorStop(0.5, colorHex);
      grd.addColorStop(0.8, colorHex);
      grd.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = grd; ctx.fillRect(0, 0, 256, 1);
      return new THREE.CanvasTexture(canvas);
    }

    // ==========================================
    // CONFIGURATION & ASTRONOMICAL DATA
    // ==========================================
    const SCALE_UNITS = 1000000; 
    const MW_CENTER = new THREE.Vector3(-4500, -300, -2000); 

    const celestialBodies = [

    // Shader for atmospheric glow around planets
    const AtmoVS = `varying vec3 vNormal; void main() { vNormal = normalize(normalMatrix * normal); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`;
    const AtmoFS = `varying vec3 vNormal; uniform vec3 glowColor; void main() { float intensity = pow(0.6 - dot(vNormal, vec3(0, 0, 1.0)), 4.0); gl_FragColor = vec4(glowColor, 1.0) * intensity * 1.8; }`;

    function createBackgroundStarfield() {
      const starsCount = 20000;
      const positions = new Float32Array(starsCount * 3);
      const colors = new Float32Array(starsCount * 3);
      
      for(let i=0; i<starsCount; i++) {
        const radius = 2000 + Math.random() * 60000; 
        const theta = 2 * Math.PI * Math.random();
        const phi = Math.acos(2 * Math.random() - 1);
        
        positions[i*3] = radius * Math.sin(phi) * Math.cos(theta);
        positions[i*3+1] = radius * Math.sin(phi) * Math.sin(theta);
        positions[i*3+2] = radius * Math.cos(phi);

        let color = new THREE.Color();
        const t = Math.random();
        if(t > 0.9) color.setHex(0xaaccff); else if(t > 0.7) color.setHex(0xffddaa); else color.setHex(0xffffff);
        
        const intensity = 0.3 + Math.random() * 0.7;
        colors[i*3] = color.r * intensity; colors[i*3+1] = color.g * intensity; colors[i*3+2] = color.b * intensity;
      }

      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
      const mat = new THREE.PointsMaterial({ size: 2.0, vertexColors: true, transparent: true, opacity: 0.9, sizeAttenuation: true });
      deepSpaceStarsGroup.add(new THREE.Points(geo, mat));
    }

    function createSolarSystemAndMilkyWay() {

        const isSun = data.id === "sun";

            mat = new THREE.MeshStandardMaterial({ map: texture, roughness: 0.7, metalness: 0.1 });

        const mesh = new THREE.Mesh(geo, mat);
        mesh.userData = data; 
        
        // Axial Tilt
        mesh.rotation.z = data.tilt * (Math.PI / 180);

        // Atmosphere Glow Shader
        if (data.atmosphere && !isSun) {
          const atmoMat = new THREE.ShaderMaterial({
            vertexShader: AtmoVS, fragmentShader: AtmoFS,
            uniforms: { glowColor: { value: new THREE.Color(data.atmosphere) } },
            blending: THREE.AdditiveBlending, side: THREE.BackSide, transparent: true
          });
          const atmoMesh = new THREE.Mesh(geo, atmoMat);
          atmoMesh.scale.setScalar(1.2);

           earthClouds = new THREE.Mesh(cloudGeo, cloudMat);
           mesh.add(earthClouds);
        }
        
        // Orbital Group Handling (Inclinations)
        const orbitGroup = new THREE.Group();
        orbitGroup.rotation.x = data.incl * (Math.PI / 180); // Orbital inclination
        
        if (isSun) {
          mesh.position.set(0, 0, 0);
          orbitGroup.add(mesh);
          
          const layers = [{s:25, o:0.9, c:0xffffff}, {s:38, o:0.6, c:0xffcc66}, {s:55, o:0.3, c:0xff6600}, {s:80, o:0.1, c:0xff2200}];
          layers.forEach(layer => {

            sprite.scale.set(layer.s, layer.s, 1); sprite.userData = { bScale: layer.s, bOpac: layer.o };
            orbitGroup.add(sprite); sunGlowSprites.push(sprite);
          });
        } else {
          mesh.position.set(data.dist, 0, 0);
          orbitGroup.add(mesh);

          // Orbit Line
          const ringGeo = new THREE.RingGeometry(data.dist - 0.15, data.dist + 0.15, 128);
          const ringMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.05, side: THREE.DoubleSide });
          const orbitLine = new THREE.Mesh(ringGeo, ringMat);
          orbitLine.rotation.x = Math.PI / 2;
          orbitGroup.add(orbitLine);
          
          // Realistic Saturn Rings
          if (data.hasRings) {
            const saturnRingGeo = new THREE.RingGeometry(data.size * 1.2, data.size * 2.4, 128);
            
            // Map 1D Canvas gradient mapping to UVs for realistic transparent gaps
            const uvs = saturnRingGeo.attributes.uv;
            for(let i=0; i<uvs.count; i++) {
                const vector = new THREE.Vector2().fromBufferAttribute(uvs, i);
                uvs.setXY(i, vector.y, 0.5); // Map radial position to U coordinate

            const saturnRing = new THREE.Mesh(saturnRingGeo, saturnRingMat);

          // Moon (Earth)
          if (data.id === 'earth') {
            const moonMesh = new THREE.Mesh(new THREE.SphereGeometry(0.4, 32, 32), new THREE.MeshStandardMaterial({map: createRockyTexture('#888','#aaa'), roughness: 0.9}));
            moonMesh.position.set(3.5, 0, 0);
            const moonPivot = new THREE.Group(); moonPivot.add(moonMesh);
            moonPivot.userData = { speed: 0.08 }; mesh.add(moonPivot); mesh.userData.moonPivot = moonPivot;

        orbitGroup.rotation.y = Math.random() * Math.PI * 2;

    // --- Black Hole & Galaxies ---
    function createBlackHole(radius, coreHex) {
       const grp = new THREE.Group(); const bhR = radius * 0.035;
       grp.add(new THREE.Mesh(new THREE.SphereGeometry(bhR, 32, 32), new THREE.MeshBasicMaterial({ color: 0x000000 })));
       
       const c = document.createElement('canvas'); c.width=256; c.height=256; const ctx = c.getContext('2d');
       const grd = ctx.createRadialGradient(128,128,50, 128,128,128);
       grd.addColorStop(0, 'rgba(255,255,255,0.9)'); grd.addColorStop(0.2, 'rgba(255,200,100,0.7)'); grd.addColorStop(1, 'rgba(0,0,0,0)');
       ctx.fillStyle=grd; ctx.fillRect(0,0,256,256);
       
       const disk = new THREE.Mesh(new THREE.RingGeometry(bhR*1.1, bhR*3.5, 64), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c), color: coreHex, side: THREE.DoubleSide, transparent: true, blending: THREE.AdditiveBlending }));
       disk.rotation.x = Math.PI/2 + 0.1; grp.add(disk);
       return grp;
    }

    function generateGalaxy(stars, radius, branches, spin, spread, coreCol, armCol, pos, addDust=false) {
      const grp = new THREE.Group();
      const pArr = new Float32Array(stars * 3), cArr = new Float32Array(stars * 3);
      const cIn = new THREE.Color(coreCol), cOut = new THREE.Color(armCol);

      for(let i=0; i<stars; i++) {
        const r = Math.pow(Math.random(), 1.5) * radius; 
        const a = (i % branches) / branches * Math.PI * 2; const s = r * spin;
        const rx = Math.pow(Math.random(), 3) * (Math.random()<0.5?1:-1) * spread * (radius - r);
        const ry = Math.pow(Math.random(), 3) * (Math.random()<0.5?1:-1) * spread * (radius - r) * 0.4;
        const rz = Math.pow(Math.random(), 3) * (Math.random()<0.5?1:-1) * spread * (radius - r);

        pArr[i*3] = Math.cos(a+s)*r + rx; pArr[i*3+1] = ry; pArr[i*3+2] = Math.sin(a+s)*r + rz;
        const mix = cIn.clone().lerp(cOut, r/radius);
        cArr[i*3] = mix.r; cArr[i*3+1] = mix.g; cArr[i*3+2] = mix.b;
      }

      const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.BufferAttribute(pArr, 3)); geo.setAttribute('color', new THREE.BufferAttribute(cArr, 3));
      grp.add(new THREE.Points(geo, new THREE.PointsMaterial({ size: 3.0, vertexColors: true, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false, opacity: 0.9 })));
      
      // Cosmic Dust Layers for Milky way
      if(addDust) {
         const dMat = new THREE.PointsMaterial({size: 150, color: 0xaa55ff, transparent: true, opacity: 0.03, depthWrite: false, blending: THREE.AdditiveBlending});
         grp.add(new THREE.Points(geo, dMat));
      }

      grp.add(createBlackHole(radius, coreCol)); grp.position.copy(pos); return grp;
    }

    function createDistantGalaxies() {
      const names = ["Andromeda", "Triangulum", "Sombrero", "Centaurus A", "Whirlpool", "Bode's", "Cartwheel", "Cigar"];
      for(let i=0; i<25; i++) {
        const d = 50000 + Math.random() * 200000; const t = Math.random() * Math.PI * 2; const p = Math.acos(2 * Math.random() - 1);
        const pos = new THREE.Vector3(d*Math.sin(p)*Math.cos(t), (Math.random()-0.5)*40000, d*Math.sin(p)*Math.sin(t));
        const gal = generateGalaxy(4000, 1000+Math.random()*3000, 2+Math.floor(Math.random()*3), 0.0015, 0.4, 0xffddaa, 0x5588ff, pos);
        gal.rotation.x = Math.random()*Math.PI; gal.rotation.y = Math.random()*Math.PI;
        distantGalaxiesGroup.add(gal);
        if (i < names.length) {
          const div = document.createElement('div'); div.className = 'cosmic-label galaxy-label'; div.textContent = names[i] + " Galaxy";
          document.getElementById('label-container').appendChild(div);
          labels.push({ element: div, position: pos, type: 'galaxy', id: `gal-${i}`, minLimit: 4000 });
        }
      }
    }

    // ==========================================
    // UI & QUIZ LOGIC
    // ==========================================
    let quizState = { current: 0, score: 0, active: false, questions: [] };

    function setupUIInteractions() {
      const raycaster = new THREE.Raycaster(); const mouse = new THREE.Vector2();

      window.addEventListener('pointerdown', (e) => {
        if (e.target.closest('.glass-panel') || e.target.tagName === 'BUTTON') return;
        mouse.x = (e.clientX / window.innerWidth)*2-1; mouse.y = -(e.clientY / window.innerHeight)*2+1;
        raycaster.setFromCamera(mouse, camera);
        const ints = raycaster.intersectObjects(planetMeshes);
        if (ints.length > 0) focusOnObject(ints[0].object);
      });

      document.getElementById('close-panel-btn').addEventListener('click', () => { document.getElementById('info-panel').classList.remove('active'); clearNav(); });
      document.getElementById('reset-btn').addEventListener('click', () => {
        followedTarget = null; isTransitioning = true; isCinematic = false;
        document.getElementById('cinematic-btn').classList.remove('active');
        targetCameraPos.set(0, 90, 250); targetControlsLookAt.set(0, 0, 0);
        document.getElementById('info-panel').classList.remove('active'); clearNav();
      });

      document.getElementById('time-slider').addEventListener('input', (e) => {
        timeMultiplier = e.target.value / 10;
        document.getElementById('time-val').textContent = timeMultiplier.toFixed(1) + "x";
      });

      document.getElementById('cinematic-btn').addEventListener('click', (e) => {
        isCinematic = !isCinematic;
        e.target.classList.toggle('active');
        if(!followedTarget) focusOnObject(planetMeshes[0]); // focus sun if nothing selected
      });

      // Quiz
      document.getElementById('global-quiz-btn').addEventListener('click', () => loadQuiz());
      document.getElementById('planet-quiz-btn').addEventListener('click', () => loadQuiz(currentQuizPlanet));
      document.getElementById('close-quiz-btn').addEventListener('click', () => document.getElementById('quiz-panel').classList.remove('active'));
      document.getElementById('quiz-next-btn').addEventListener('click', () => { quizState.current++; quizState.active=true; document.getElementById('quiz-next-btn').classList.add('hidden'); renderQ(); });
      document.getElementById('quiz-restart-btn').addEventListener('click', () => loadQuiz(currentQuizPlanet));
    }

    function clearNav() { document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active')); }

    function focusOnObject(mesh) {
      const d = mesh.userData; followedTarget = mesh; isTransitioning = true; cinematicAngle = 0; currentQuizPlanet = d.isGalaxy ? null : d.name;
      document.getElementById('p-visual-container').innerHTML = `<div class="css-planet" style="background: ${d.cssGradient};"></div>` + (d.hasRings ? `<div class="css-rings"></div>` : '');
      document.getElementById('p-name').textContent = d.name.toUpperCase(); document.getElementById('p-type').textContent = d.type; document.getElementById('p-desc').textContent = d.desc;
      document.getElementById('lbl-dist').textContent = d.isGalaxy ? "Dist to Center" : "Distance";
      document.getElementById('p-dist').textContent = d.id==='sun' || d.isGalaxy ? 'Center' : (d.dist/36).toFixed(2)+' AU';
      document.getElementById('p-size').textContent = d.isGalaxy ? d.facts.diameter : d.size.toFixed(1)+' R⊕';
      document.getElementById('p-period').textContent = d.period; document.getElementById('p-moons').textContent = d.moons;
      
      const grid = document.getElementById('p-facts-grid'); grid.innerHTML = '';
      if(d.facts) Object.entries(d.facts).forEach(([k, v]) => { if(k==='diameter'&&d.isGalaxy)return; grid.innerHTML += `<div class="data-card"><h4>${k.replace(/([A-Z])/g, ' $1').trim()}</h4><span>${v}</span></div>`; });

      const atmo = document.getElementById('atmosphere-section'); const chart = document.getElementById('p-chart-container');
      if(d.gases && d.gases.length > 0) {
        atmo.style.display = 'block'; chart.innerHTML = ''; const h = [80, 60, 40, 25, 15]; 
        d.gases.forEach((g, i) => chart.innerHTML += `<div class="chart-bar" style="height: ${h[i]}%; animation-delay: ${i*0.1}s" data-label="${g}"></div>`);
        document.getElementById('planet-quiz-btn').style.display = 'block';
      } else { atmo.style.display = 'none'; document.getElementById('planet-quiz-btn').style.display = d.isGalaxy ? 'none' : 'block'; }

      document.getElementById('info-panel').style.borderTop = `3px solid #${d.color.toString(16).padStart(6, '0')}`;
      document.getElementById('info-panel').classList.add('active'); document.getElementById('quiz-panel').classList.remove('active'); 
      clearNav(); document.querySelectorAll('.nav-btn').forEach(b => { if(b.textContent === d.name.toUpperCase()) b.classList.add('active'); });
    }

    function loadQuiz() {
      document.getElementById('info-panel').classList.remove('active'); document.getElementById('quiz-panel').classList.add('active');
      quizState = { current:0, score:0, active:true, questions: [...quizQuestions].sort(()=>0.5-Math.random()).slice(0,5) };
      document.getElementById('quiz-total').textContent = 5; document.getElementById('quiz-score').textContent = 0;
      document.getElementById('quiz-next-btn').classList.add('hidden'); document.getElementById('quiz-restart-btn').classList.add('hidden'); renderQ();
    }
    function renderQ() {
      const q = quizState.questions[quizState.current]; document.getElementById('quiz-question').textContent = q.q;
      const opts = document.getElementById('quiz-options'); opts.innerHTML = '';
      q.opts.forEach((o, i) => { const b = document.createElement('button'); b.className='quiz-option'; b.textContent=o; b.onclick=()=>handleAns(i,b); opts.appendChild(b); });
    }
    function handleAns(sel, btn) {
      if(!quizState.active) return; quizState.active = false; const cor = quizState.questions[quizState.current].ans;
      const opts = document.querySelectorAll('.quiz-option'); opts.forEach(o=>o.classList.add('disabled'));
      if(sel === cor) { btn.classList.add('correct'); quizState.score++; document.getElementById('quiz-score').textContent = quizState.score; } 
      else { btn.classList.add('wrong'); opts[cor].classList.add('correct'); }
      if(quizState.current < 4) document.getElementById('quiz-next-btn').classList.remove('hidden');
      else { document.getElementById('quiz-restart-btn').classList.remove('hidden'); document.getElementById('quiz-question').textContent = `🎉 COMPLETE! Score: ${quizState.score}/5`; }
    }
    function onWindowResize() { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); }

    // ==========================================
    // RENDER LOOP
    // ==========================================
    function animate() {
      requestAnimationFrame(animate);
      const delta = Math.min(clock.getDelta(), 0.1); const time = clock.getElapsedTime(); const dist = camera.position.distanceTo(controls.target);

      // Orbits
      solarSystemGroup.children.forEach(grp => {
        if(grp.userData && grp.userData.isComet) {
            grp.rotation.y -= grp.userData.speed * delta * 15 * timeMultiplier;
            const a = grp.rotation.y; const r = 160 + 115 * Math.cos(a); 
            grp.userData.mesh.position.set(r - 65, 0, 0); grp.userData.mesh.rotation.y = a + Math.PI/2;
        } else if(grp.userData && grp.userData.speed) {
            grp.rotation.y -= grp.userData.speed * delta * 10 * timeMultiplier; 
        }
      });

      // Planet Spin & Clouds
      planetMeshes.forEach(m => {
        if(!m.userData.isGalaxy) {
            m.rotation.y += (m.userData.id === 'sun' ? -0.002 : 0.01) * timeMultiplier;
            if(m.userData.moonPivot) m.userData.moonPivot.rotation.y -= m.userData.moonPivot.userData.speed * delta * 100 * timeMultiplier;
        }
      });
      if(earthClouds) earthClouds.rotation.y += 0.015 * timeMultiplier;

      // Sun pulse
      sunGlowSprites.forEach((s, i) => { s.scale.setScalar(s.userData.bScale + Math.sin(time*(2-i*0.3))*(1+i)); s.material.opacity = s.userData.bOpac + Math.sin(time*3+i)*0.05; });
      milkyWayGroup.rotation.y -= 0.0002 * timeMultiplier; distantGalaxiesGroup.rotation.y -= 0.00005 * timeMultiplier;
      distantGalaxiesGroup.visible = dist >= 3000; // LOD

      // Camera Handling
      if (followedTarget) {
        const wPos = new THREE.Vector3(); followedTarget.getWorldPosition(wPos); targetControlsLookAt.copy(wPos);
        
        let offset;
        if(isCinematic) {
            // Cinematic Orbiting Camera Math
            cinematicAngle += 0.005 * (timeMultiplier === 0 ? 1 : timeMultiplier); // Keep spinning even if paused
            const r = followedTarget.userData.isGalaxy ? followedTarget.userData.size * 1.5 : followedTarget.userData.size * 4.5;
            offset = new THREE.Vector3(Math.cos(cinematicAngle)*r, r*0.5, Math.sin(cinematicAngle)*r);
        } else {
            // Static Follow
            offset = followedTarget.userData.isGalaxy ? new THREE.Vector3(0, followedTarget.userData.size*0.8, followedTarget.userData.size*1.6) : new THREE.Vector3(followedTarget.userData.size*3, followedTarget.userData.size*2, followedTarget.userData.size*5);
        }
        targetCameraPos.copy(wPos).add(offset);
      }

      if (isTransitioning || followedTarget) {
        camera.position.lerp(targetCameraPos, isCinematic ? 0.08 : 0.04); controls.target.lerp(targetControlsLookAt, 0.06);
        if (!followedTarget && camera.position.distanceTo(targetCameraPos) < 1) isTransitioning = false;
      }

      updateHUD(dist); updateLabels(dist); controls.update(); renderer.render(scene, camera);
    }

    function updateHUD(dist) {
      const v = document.getElementById('view-layer'); const d = document.getElementById('dist-value'); const s = document.getElementById('scale-info');
      if (dist < 300) { v.textContent = "SOLAR SYSTEM"; d.textContent = Math.floor(dist * SCALE_UNITS).toLocaleString() + " KM"; s.style.borderColor = "var(--neon-blue)"; }
      else if (dist < 4000) { v.textContent = "INTERSTELLAR"; d.textContent = (dist / 10).toFixed(2) + " LIGHT YEARS"; s.style.borderColor = "var(--neon-pink)"; }
      else { v.textContent = "DEEP SPACE"; d.textContent = (dist / 1000).toFixed(2) + " KILOPARSECS"; s.style.borderColor = "var(--neon-purple)"; }
    }

    function updateLabels(cDist) {
      labels.forEach(l => {
        if (l.type === 'galaxy' && l.id !== 'milkyway' && !distantGalaxiesGroup.visible) { l.element.classList.remove('visible'); return; }
        const sPos = new THREE.Vector3();
        if (l.type === 'planet') { if(cDist > l.limit) { l.element.classList.remove('visible'); return; } l.object.getWorldPosition(sPos); } 
        else { if(cDist < l.minLimit) { l.element.classList.remove('visible'); return; } sPos.copy(l.position); sPos.applyMatrix4(l.id==='milkyway' ? milkyWayGroup.matrixWorld : distantGalaxiesGroup.matrixWorld); }
        sPos.project(camera);
        if(sPos.z < 1 && sPos.z > -1) { l.element.style.left = `${(sPos.x*0.5+0.5)*window.innerWidth}px`; l.element.style.top = `${(-sPos.y*0.5+0.5)*window.innerHeight - 25}px`; l.element.classList.add('visible'); } 
        else l.element.classList.remove('visible');
      });
    }
  </script>
